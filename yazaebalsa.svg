<svg width="100%" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: monospace;
      font-size: 32px;
      font-weight: 700;
      fill: #ff0000;
    }

    .cursor {
      fill: #ff0000;
      animation: blink 0.65s infinite;
    }

    @keyframes blink {
      0%, 45%   { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="typing">
      <rect x="100" y="0" width="1000" height="90">
        <animate
          attributeName="width"
          values="0;0;1000;1000;0;0"
          keyTimes="0;0.08;0.52;0.65;0.94;1"
          dur="7s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#typing)">
    <text
      x="600"
      y="57"
      text-anchor="middle"
      class="text"
    >i løst my rank and title, i turned my back øn it.</text>
  </g>

  <rect
    class="cursor"
    x="100"
    y="28"
    width="4"
    height="36"
  >
    <animate
      attributeName="x"
      values="100;100;1100;1100;100;100"
      keyTimes="0;0.08;0.52;0.65;0.94;1"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
