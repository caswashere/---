<svg width="100%" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: monospace;
      font-size: 28px;
      fill: #ff0000;
    }

    .cursor {
      fill: #ff0000;
      animation: blink 0.65s infinite;
    }

    @keyframes blink {
      0%, 45%   { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="typing">
      <rect x="90" y="0" width="720" height="80">
        <animate
          attributeName="width"
          values="0;0;720;720;0;0"
          keyTimes="0;0.08;0.52;0.65;0.94;1"
          dur="7s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#typing)">
    <text
      x="450"
      y="50"
      text-anchor="middle"
      class="text"
    >yøu've gøt øne time tø figure it øut.</text>
  </g>

  <rect
    class="cursor"
    x="90"
    y="24"
    width="3"
    height="32"
  >
    <animate
      attributeName="x"
      values="90;90;810;810;90;90"
      keyTimes="0;0.08;0.52;0.65;0.94;1"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
